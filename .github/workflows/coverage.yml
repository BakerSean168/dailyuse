name: Coverage

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  CI: 'true'
  NODE_ENV: test
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  GOVERNED_DOMAIN_COVERAGE_PROJECTS: 'account,ai,domain-shared,goal,governance,notification,reminder,schedule,setting,task'
  APP_VUE_STORE_COVERAGE_PROJECTS: 'app-vue'
  USE_CASES_COVERAGE_PROJECTS: 'task,goal,reminder,schedule'
  PRISMA_MAPPERS_COVERAGE_PROJECTS: 'task,goal,reminder,schedule'

jobs:
  coverage:
    name: Coverage Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}
          setup-python: 'false'
          setup-uv: 'false'

      - name: Detect coverage targets
        id: detect-coverage
        shell: bash
        run: |
          set -euo pipefail

          project_has_target() {
            local project="$1"
            local target_projects="$2"

            grep -Fxq "$project" <<< "$target_projects"
          }

          select_projects() {
            local output_prefix="$1"
            local target_name="$2"
            local allowed_csv="$3"
            local project_source="$4"
            local has_target=false
            local selected_projects=""
            local allowed=",${allowed_csv},"
            local target_projects
            target_projects="$(pnpm exec nx show projects --with-target="$target_name")"

            while IFS= read -r project; do
              [ -z "$project" ] && continue

              if [[ "$allowed" != *",$project,"* ]]; then
                continue
              fi

              if project_has_target "$project" "$target_projects"; then
                echo "Selected $project for $target_name"
                has_target=true
                selected_any=true
                if [ -z "$selected_projects" ]; then
                  selected_projects="$project"
                else
                  selected_projects="$selected_projects,$project"
                fi
              fi
            done <<< "$project_source"

            echo "${output_prefix}_has_target=$has_target" >> "$GITHUB_OUTPUT"
            echo "${output_prefix}_projects=$selected_projects" >> "$GITHUB_OUTPUT"
          }

          selected_any=false

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Using affected project detection for push coverage."
            DOMAIN_PROJECT_SOURCE="$(pnpm exec nx show projects --affected)"
            STORE_PROJECT_SOURCE="$DOMAIN_PROJECT_SOURCE"
            USE_CASES_PROJECT_SOURCE="$DOMAIN_PROJECT_SOURCE"
            PRISMA_MAPPERS_PROJECT_SOURCE="$DOMAIN_PROJECT_SOURCE"
          else
            echo "Using full configured project lists for scheduled/manual coverage."
            DOMAIN_PROJECT_SOURCE="$(printf '%s\n' ${GOVERNED_DOMAIN_COVERAGE_PROJECTS//,/ })"
            STORE_PROJECT_SOURCE="$(printf '%s\n' ${APP_VUE_STORE_COVERAGE_PROJECTS//,/ })"
            USE_CASES_PROJECT_SOURCE="$(printf '%s\n' ${USE_CASES_COVERAGE_PROJECTS//,/ })"
            PRISMA_MAPPERS_PROJECT_SOURCE="$(printf '%s\n' ${PRISMA_MAPPERS_COVERAGE_PROJECTS//,/ })"
          fi

          select_projects "domain" "test:coverage" "${GOVERNED_DOMAIN_COVERAGE_PROJECTS}" "$DOMAIN_PROJECT_SOURCE"
          select_projects "store" "test:coverage" "${APP_VUE_STORE_COVERAGE_PROJECTS}" "$STORE_PROJECT_SOURCE"
          select_projects "use_cases" "test:coverage:use-cases" "${USE_CASES_COVERAGE_PROJECTS}" "$USE_CASES_PROJECT_SOURCE"
          select_projects "prisma_mappers" "test:coverage:prisma-mappers" "${PRISMA_MAPPERS_COVERAGE_PROJECTS}" "$PRISMA_MAPPERS_PROJECT_SOURCE"

          if [ "${{ github.event_name }}" != "push" ] && [ "$selected_any" != 'true' ]; then
            echo "Full coverage audit selected no configured targets; refusing a false-green run."
            exit 1
          fi

      - name: No coverage targets selected
        if: steps.detect-coverage.outputs.domain_has_target != 'true' && steps.detect-coverage.outputs.store_has_target != 'true' && steps.detect-coverage.outputs.use_cases_has_target != 'true' && steps.detect-coverage.outputs.prisma_mappers_has_target != 'true'
        run: echo "No coverage targets selected for this run."

      - name: Run governed domain coverage gates
        if: steps.detect-coverage.outputs.domain_has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage --projects="${{ steps.detect-coverage.outputs.domain_projects }}" --parallel=2 --outputStyle=static

      - name: Run app-vue store coverage gates
        if: steps.detect-coverage.outputs.store_has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage --projects="${{ steps.detect-coverage.outputs.store_projects }}" --parallel=1 --outputStyle=static

      - name: Run use-cases coverage gates
        if: steps.detect-coverage.outputs.use_cases_has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage:use-cases --projects="${{ steps.detect-coverage.outputs.use_cases_projects }}" --parallel=2 --outputStyle=static

      - name: Run prisma-mappers coverage gates
        if: steps.detect-coverage.outputs.prisma_mappers_has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage:prisma-mappers --projects="${{ steps.detect-coverage.outputs.prisma_mappers_projects }}" --parallel=2 --outputStyle=static
