name: Release Assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and upload assets for
        required: true
        type: string
      sha:
        description: Exact release SHA; empty resolves from the tag
        required: false
        type: string

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  prepare-release:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Resolve exact tag and SHA
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const requestedSha = process.env.RELEASE_SHA;
            if (!tag) {
              core.setFailed('release tag is required');
              return;
            }
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            });
            let tagSha = ref.data.object.sha;
            if (ref.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagSha,
              });
              tagSha = annotated.data.object.sha;
            }
            if (requestedSha && requestedSha !== tagSha) {
              core.setFailed(`${tag} points to ${tagSha}, requested SHA was ${requestedSha}`);
              return;
            }
            core.setOutput('release_tag', tag);
            core.setOutput('release_sha', tagSha);

  build-release-assets:
    needs: prepare-release
    name: Build ${{ matrix.platform }} Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            platform_os: windows
            arch: x64
            signing_state: unsigned
            builder_args: --win nsis zip --x64
          - os: ubuntu-latest
            platform: linux-x64
            platform_os: linux
            arch: x64
            signing_state: unsigned
            builder_args: --linux AppImage deb rpm --x64
          - os: macos-15-intel
            platform: macos-x64
            platform_os: macos
            arch: x64
            signing_state: unsigned-pilot
            builder_args: --mac dmg zip --x64
          - os: macos-15
            platform: macos-arm64
            platform_os: macos
            arch: arm64
            signing_state: unsigned-pilot
            builder_args: --mac dmg zip --arm64

    steps:
      - name: Checkout release packaging tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          path: release-source

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: release-source/apps/desktop/.python-version

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        working-directory: release-source
        env:
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Validate release contract
        working-directory: release-source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node ./tools/ci-cd-platform/release-tools/release-contract.mjs --require-release --expected-tag "$RELEASE_TAG"

      - name: Build desktop application
        working-directory: release-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm nx run desktop:build:production --outputStyle=static

      - name: Package desktop application
        working-directory: release-source/apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec electron-builder ${{ matrix.builder_args }} --publish never --config ../../../release-tooling/apps/desktop/electron-builder.json5
          node ./scripts/verify-packaged-runtime-deps.mjs
          if [ "${{ matrix.platform_os }}" = macos ] && [ -f dist-package/latest-mac.yml ]; then
            mv dist-package/latest-mac.yml "dist-package/latest-mac-${{ matrix.arch }}.yml"
          fi

      - name: Write Desktop platform receipt
        working-directory: release-source/apps/desktop
        shell: bash
        run: >-
          node ../../../release-tooling/tools/ci-cd-platform/release-tools/write-desktop-platform-receipt.mjs
          dist-package
          "${{ matrix.platform }}"
          "${{ matrix.platform_os }}"
          "${{ matrix.arch }}"
          "${{ matrix.signing_state }}"
          "${{ needs.prepare-release.outputs.release_tag }}"
          "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-source/apps/desktop/dist-package
          if-no-files-found: error
          compression-level: 9

  upload-release-assets:
    name: Upload Draft Release Assets
    needs:
      - prepare-release
      - build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: artifacts

      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"

      - name: Build desktop release evidence
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        shell: bash
        run: |
          node ./tools/ci-cd-platform/release-tools/create-desktop-manifest.mjs artifacts "$RELEASE_TAG" "$RELEASE_SHA" desktop-release-manifest.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('desktop-release-manifest.json', 'utf8'));
          await writeFile('SHA256SUMS.txt', `${manifest.assets.map((asset) => `${asset.sha256}  ${asset.name}`).join('\n')}\n`);
          NODE

      - name: Upload assets to draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f \
            \( -name '*Setup.exe' -o -name '*Setup.zip' -o -name '*.blockmap' -o \
               -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name 'latest*.yml' \) \
            -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were found in downloaded artifacts."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" desktop-release-manifest.json SHA256SUMS.txt --clobber
