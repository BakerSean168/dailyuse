name: Release Assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and upload assets for
        required: true
        type: string
      sha:
        description: Exact release SHA; empty resolves from the tag
        required: false
        type: string

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  prepare-release:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Resolve exact tag and SHA
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const requestedSha = process.env.RELEASE_SHA;
            if (!tag) {
              core.setFailed('release tag is required');
              return;
            }
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            });
            let tagSha = ref.data.object.sha;
            if (ref.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: tagSha,
              });
              tagSha = annotated.data.object.sha;
            }
            if (requestedSha && requestedSha !== tagSha) {
              core.setFailed(`${tag} points to ${tagSha}, requested SHA was ${requestedSha}`);
              return;
            }
            core.setOutput('release_tag', tag);
            core.setOutput('release_sha', tagSha);

  build-release-assets:
    needs: prepare-release
    name: Build ${{ matrix.platform }} Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            platform_os: windows
            arch: x64
            signing_state: unsigned
            runtime_executable_kind: packaged-exe
            builder_args: --win nsis zip --x64
          - os: ubuntu-latest
            platform: linux-x64
            platform_os: linux
            arch: x64
            signing_state: unsigned
            runtime_executable_kind: installed-deb
            builder_args: --linux AppImage deb rpm --x64
          - os: macos-15-intel
            platform: macos-x64
            platform_os: macos
            arch: x64
            signing_state: unsigned-pilot
            runtime_executable_kind: packaged-app
            builder_args: --mac dmg zip --x64
          - os: macos-15
            platform: macos-arm64
            platform_os: macos
            arch: arm64
            signing_state: unsigned-pilot
            runtime_executable_kind: packaged-app
            builder_args: --mac dmg zip --arm64

    steps:
      - name: Checkout release packaging tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          path: release-source

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: release-source/apps/desktop/.python-version

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x64

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot xvfb dbus-x11 gnome-keyring libsecret-tools

      - name: Install dependencies
        working-directory: release-source
        env:
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Validate release contract
        working-directory: release-source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node ./tools/ci-cd-platform/release-tools/release-contract.mjs --require-release --expected-tag "$RELEASE_TAG"

      - name: Build desktop application
        working-directory: release-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
        run: pnpm nx run desktop:build:production --outputStyle=static

      - name: Rebuild hoisted Windows native dependencies for Electron
        if: runner.os == 'Windows'
        working-directory: release-source
        shell: bash
        run: |
          node <<'NODE'
          const { readFile } = require('node:fs/promises');
          const path = require('node:path');

          (async () => {
          const { rebuild } = await import('@electron/rebuild');

          const root = process.cwd();
          const desktop = path.join(root, 'apps', 'desktop');
          const packageJson = JSON.parse(await readFile(path.join(root, 'package.json'), 'utf8'));
          const electronVersion = packageJson.devDependencies?.electron;
          if (!electronVersion) throw new Error('release source does not declare an Electron version');

          const requiredModules = ['argon2', 'better-sqlite3'];
          const task = rebuild({
            buildPath: desktop,
            projectRootPath: root,
            electronVersion,
            arch: 'x64',
            platform: 'win32',
            onlyModules: requiredModules,
            force: true,
            mode: 'sequential',
            disablePreGypCopy: true,
          });
          let foundModules = [];
          task.lifecycle.on('modules-found', (modules) => {
            foundModules = modules;
          });
          await task;
          for (const moduleName of requiredModules) {
            if (!foundModules.includes(moduleName)) {
              throw new Error(`Electron rebuild did not discover required native module: ${moduleName}`);
            }
          }
          console.log(`[release] Electron ${electronVersion} native rebuild complete: ${foundModules.join(', ')}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Package desktop application
        working-directory: release-source/apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/release-source/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec electron-builder ${{ matrix.builder_args }} --publish never --config ../../../release-tooling/apps/desktop/electron-builder.json5
          node ./scripts/verify-packaged-runtime-deps.mjs
          if [ "${{ matrix.platform_os }}" = macos ] && [ -f dist-package/latest-mac.yml ]; then
            mv dist-package/latest-mac.yml "dist-package/latest-mac-${{ matrix.arch }}.yml"
          fi

      - name: Resolve packaged Desktop executable
        id: packaged-executable
        working-directory: release-source
        shell: bash
        run: |
          resolver="${{ github.workspace }}/release-tooling/apps/desktop/scripts/resolve-packaged-executable.mjs"
          test -f "$resolver"
          executable="$(node "$resolver" apps/desktop/dist-package "${{ matrix.platform }}")"
          test -n "$executable"
          echo "path=$executable" >> "$GITHUB_OUTPUT"

      - name: Run packaged Desktop runtime smoke
        working-directory: release-source
        shell: bash
        env:
          MEMOFLOW_PACKAGED_EXECUTABLE: ${{ steps.packaged-executable.outputs.path }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ./apps/desktop/scripts/run-linux-packaged-smoke-with-keyring.sh
          else
            pnpm nx run desktop:test:packaged-smoke --outputStyle=static
          fi

      - name: Install Linux Debian package
        if: runner.os == 'Linux'
        working-directory: release-source
        shell: bash
        run: |
          shopt -s nullglob
          debs=(apps/desktop/dist-package/*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb -f "${debs[0]}" Package Version Architecture Depends
          deb_path="$(realpath "${debs[0]}")"
          test -f "$deb_path"
          sudo apt-get install -y "$deb_path"
          test -x /opt/MemoFlow/memoflow
          test -f /usr/share/applications/memoflow.desktop

      - name: Run installed Linux Debian runtime smoke
        if: runner.os == 'Linux'
        working-directory: release-source
        shell: bash
        env:
          MEMOFLOW_PACKAGED_EXECUTABLE: /opt/MemoFlow/memoflow
        run: ./apps/desktop/scripts/run-linux-packaged-smoke-with-keyring.sh

      - name: Write Desktop platform receipt
        working-directory: release-source/apps/desktop
        shell: bash
        run: >-
          node ../../../release-tooling/tools/ci-cd-platform/release-tools/write-desktop-platform-receipt.mjs
          dist-package
          "${{ matrix.platform }}"
          "${{ matrix.platform_os }}"
          "${{ matrix.arch }}"
          "${{ matrix.signing_state }}"
          "${{ needs.prepare-release.outputs.release_tag }}"
          "${{ needs.prepare-release.outputs.release_sha }}"
          "passed"
          "packaged-electron-playwright"
          "${{ matrix.runtime_executable_kind }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-source/apps/desktop/dist-package
          if-no-files-found: error
          compression-level: 9

  upload-release-assets:
    name: Upload Draft Release Assets
    needs:
      - prepare-release
      - build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: artifacts

      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"

      - name: Build desktop release evidence
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        shell: bash
        run: |
          node ./tools/ci-cd-platform/release-tools/create-desktop-manifest.mjs artifacts "$RELEASE_TAG" "$RELEASE_SHA" desktop-release-manifest.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('desktop-release-manifest.json', 'utf8'));
          await writeFile('SHA256SUMS.txt', `${manifest.assets.map((asset) => `${asset.sha256}  ${asset.name}`).join('\n')}\n`);
          NODE

      - name: Upload the manifest-owned asset set to the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            node ./tools/ci-cd-platform/release-tools/resolve-desktop-release-assets.mjs \
              desktop-release-manifest.json artifacts
          )
          expected_count="$(jq '.assets | length' desktop-release-manifest.json)"
          [ "${#files[@]}" -eq "$expected_count" ] || {
            echo "resolved ${#files[@]} Desktop assets; manifest requires $expected_count" >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            desktop-release-manifest.json SHA256SUMS.txt --clobber
          gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" > github-release-assets.json
          node ./tools/ci-cd-platform/release-tools/verify-desktop-release-assets.mjs \
            desktop-release-manifest.json github-release-assets.json
