name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets for (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  prepare-release:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}

    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"

          if [ -z "$TAG" ]; then
            echo "Release tag is required."
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  build-release-assets:
    needs: prepare-release
    name: Build ${{ matrix.platform }} Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dist_configuration: windows
          - os: ubuntu-latest
            platform: linux
            dist_configuration: linux

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Restore desktop release build overrides from main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- apps/desktop/project.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: apps/desktop/.python-version

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        env:
          # pnpm may build native deps during install because root package.json
          # still whitelists argon2/better-sqlite3 in onlyBuiltDependencies.
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          npm_config_msvs_version: 2022
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")

          if [ "$ROOT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Root package version ($ROOT_VERSION) does not match release tag ($EXPECTED_VERSION)"
            exit 1
          fi

          if [ "$DESKTOP_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Desktop package version ($DESKTOP_VERSION) does not match release tag ($EXPECTED_VERSION)"
            exit 1
          fi

      - name: Build desktop application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          npm_config_msvs_version: 2022
        # desktop:build already pulls its Nx build dependencies, so this stays
        # focused on the desktop release path and avoids unrelated apps such as
        # the Python ai-service.
        run: pnpm nx run desktop:build:production --outputStyle=static

      - name: Package desktop application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
          PYTHON: ${{ env.pythonLocation }}/python
          npm_config_python: ${{ env.pythonLocation }}/python
          npm_config_msvs_version: 2022
        run: pnpm nx run desktop:dist:${{ matrix.dist_configuration }} --outputStyle=static

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: apps/desktop/dist-package
          if-no-files-found: error
          compression-level: 9

  upload-release-assets:
    name: Upload Release Assets
    if: ${{ always() }}
    needs:
      - prepare-release
      - build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: artifacts

      - name: Summarize partial build status
        if: ${{ needs.build-release-assets.result != 'success' }}
        shell: bash
        run: |
          echo "One or more platform builds failed. Uploading any assets that were produced." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate downloaded assets
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/latest*.yml
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were found in downloaded artifacts."
            exit 1
          fi

          {
            echo "Assets ready for upload:"
            printf -- '- %s\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            artifacts/**/*Setup.exe
            artifacts/**/*Setup.zip
            artifacts/**/*.blockmap
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
