name: Release Assets

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  build-release-assets:
    name: Build ${{ matrix.platform }} Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            dist_configuration: windows
          - os: ubuntu-latest
            platform: linux
            dist_configuration: linux

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")

          if [ "$ROOT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Root package version ($ROOT_VERSION) does not match release tag ($EXPECTED_VERSION)"
            exit 1
          fi

          if [ "$DESKTOP_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Desktop package version ($DESKTOP_VERSION) does not match release tag ($EXPECTED_VERSION)"
            exit 1
          fi

      - name: Build workspace dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t build --all --exclude=api,web,desktop --outputStyle=static

      - name: Build desktop application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run desktop:build:production --outputStyle=static

      - name: Package desktop application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run desktop:dist:${{ matrix.dist_configuration }} --outputStyle=static

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: apps/desktop/dist/**/*
          if-no-files-found: error
          compression-level: 9

  upload-release-assets:
    name: Upload Release Assets
    needs: build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*Setup.exe
            artifacts/**/*Setup.zip
            artifacts/**/*.blockmap
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
