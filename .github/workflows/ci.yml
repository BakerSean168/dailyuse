name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# 设置并发策略，避免重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧭 Validate test target governance
        run: pnpm test:targets:check

      - name: 🧹 Lint affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        shell: bash
        run: |
          EXCLUDED_PROJECTS=$(pnpm exec nx show projects | awk '/^prisma-client-/{printf "%s%s", sep, $0; sep=","}')
          if [ -n "$EXCLUDED_PROJECTS" ]; then
            echo "Excluding generated Prisma projects from lint: $EXCLUDED_PROJECTS"
            pnpm exec nx affected -t lint --parallel=3 --exclude="$EXCLUDED_PROJECTS" --outputStyle=static
          else
            pnpm exec nx affected -t lint --parallel=3 --outputStyle=static
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 Typecheck affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t typecheck --parallel=3 --outputStyle=static

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧪 Test affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test --parallel=3 --exclude=daily-use --passWithNoTests --outputStyle=static

  domain-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📊 Run affected domain coverage gates
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:coverage --parallel=2 --outputStyle=static

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🏗️ Build affected apps
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t build --parallel=3 --exclude='contracts,utils,ui-core,assets,sync-client' --outputStyle=static

  ci-success:
    needs: [lint, typecheck, test, domain-coverage, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: ✅ Check CI status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.domain-coverage.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
