name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# 设置并发策略，避免重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate test target governance
        run: pnpm test:targets:check

      - name: Lint affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        shell: bash
        run: |
          EXCLUDED_PROJECTS=$(pnpm exec nx show projects | awk '/^prisma-client-/{printf "%s%s", sep, $0; sep=","}')
          if [ -n "$EXCLUDED_PROJECTS" ]; then
            echo "Excluding generated Prisma projects from lint: $EXCLUDED_PROJECTS"
            pnpm exec nx affected -t lint --parallel=3 --exclude="$EXCLUDED_PROJECTS" --outputStyle=static
          else
            pnpm exec nx affected -t lint --parallel=3 --outputStyle=static
          fi

      - name: Typecheck affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t typecheck --parallel=3 --outputStyle=static

      - name: Test affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test --parallel=3 --exclude=daily-use --passWithNoTests --outputStyle=static

      - name: Build affected apps
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t build --parallel=3 --exclude='contracts,utils,ui-core,assets,sync-client' --outputStyle=static

  boundary-tests:
    name: Boundary Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
      JWT_SECRET: test-jwt-secret-not-for-production
      TZ: UTC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}
          setup-python: 'false'
          setup-uv: 'false'

      - name: Detect affected boundary targets
        id: detect-boundary
        shell: bash
        run: |
          set -euo pipefail

          project_has_target() {
            local project="$1"
            local target_name="$2"

            TARGET_NAME="$target_name" pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);const target=process.env.TARGET_NAME;process.exit(p.targets && p.targets[target] ? 0 : 1);});"
          }

          has_any=false
          has_smoke=false
          has_integration=false
          has_ipc=false
          has_main=false

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if project_has_target "$project" "test:smoke"; then
              echo "Affected project with test:smoke: $project"
              has_smoke=true
              has_any=true
            fi

            if project_has_target "$project" "test:integration"; then
              echo "Affected project with test:integration: $project"
              has_integration=true
              has_any=true
            fi

            if project_has_target "$project" "test:ipc"; then
              echo "Affected project with test:ipc: $project"
              has_ipc=true
              has_any=true
            fi

            if project_has_target "$project" "test:main"; then
              echo "Affected project with test:main: $project"
              has_main=true
              has_any=true
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_any=$has_any" >> "$GITHUB_OUTPUT"
          echo "has_smoke=$has_smoke" >> "$GITHUB_OUTPUT"
          echo "has_integration=$has_integration" >> "$GITHUB_OUTPUT"
          echo "has_ipc=$has_ipc" >> "$GITHUB_OUTPUT"
          echo "has_main=$has_main" >> "$GITHUB_OUTPUT"

      - name: No boundary targets affected
        if: steps.detect-boundary.outputs.has_any != 'true'
        run: echo "No boundary targets affected; skipping boundary test execution."

      - name: Run affected smoke tests
        if: steps.detect-boundary.outputs.has_smoke == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:smoke --parallel=2 --outputStyle=static

      - name: Start integration database
        if: steps.detect-boundary.outputs.has_integration == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name ci-postgres \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_pass \
            -e POSTGRES_DB=memoflow_test \
            -p 5433:5432 \
            --health-cmd "pg_isready -U test_user -d memoflow_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:15

          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' ci-postgres)"
            if [ "$status" = "healthy" ]; then
              echo "Postgres is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "Postgres failed to become healthy in time."
          docker logs ci-postgres
          exit 1

      - name: Push Prisma schema to test database
        if: steps.detect-boundary.outputs.has_integration == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run database:prisma-push

      - name: Run affected integration tests
        if: steps.detect-boundary.outputs.has_integration == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:integration --parallel=1 --outputStyle=static

      - name: Run affected IPC tests
        if: steps.detect-boundary.outputs.has_ipc == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:ipc --parallel=1 --outputStyle=static

      - name: Run affected main-process tests
        if: steps.detect-boundary.outputs.has_main == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:main --parallel=1 --outputStyle=static

      - name: Stop integration database
        if: always() && steps.detect-boundary.outputs.has_integration == 'true'
        shell: bash
        run: docker rm -f ci-postgres || true

  web-flow:
    name: Web Flow Oracle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/memoflow_test
      JWT_SECRET: test-jwt-secret-for-e2e
      TZ: UTC

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: memoflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d memoflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}
          setup-python: 'false'
          setup-uv: 'false'

      - name: Push Prisma schema to test database
        run: pnpm exec nx run database:prisma-push

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web flow oracle
        run: pnpm nx run web:e2e
