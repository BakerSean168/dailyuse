name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# 设置并发策略，避免重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  GOVERNED_DOMAIN_COVERAGE_PROJECTS: 'account,ai,authentication,domain-shared,editor,goal,governance,notification,reminder,schedule,setting,task'
  APP_VUE_STORE_COVERAGE_PROJECTS: 'app-vue'
  USE_CASES_COVERAGE_PROJECTS: 'task,goal,reminder,schedule'
  PRISMA_MAPPERS_COVERAGE_PROJECTS: 'task,goal,reminder,schedule'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧭 Validate test target governance
        run: pnpm test:targets:check

      - name: 🧹 Lint affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        shell: bash
        run: |
          EXCLUDED_PROJECTS=$(pnpm exec nx show projects | awk '/^prisma-client-/{printf "%s%s", sep, $0; sep=","}')
          if [ -n "$EXCLUDED_PROJECTS" ]; then
            echo "Excluding generated Prisma projects from lint: $EXCLUDED_PROJECTS"
            pnpm exec nx affected -t lint --parallel=3 --exclude="$EXCLUDED_PROJECTS" --outputStyle=static
          else
            pnpm exec nx affected -t lint --parallel=3 --outputStyle=static
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 Typecheck affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t typecheck --parallel=3 --outputStyle=static

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧪 Test affected projects
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test --parallel=3 --exclude=daily-use --passWithNoTests --outputStyle=static

  domain-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected governed domain coverage targets
        id: detect-domain-coverage
        shell: bash
        run: |
          set -euo pipefail

          has_target=false
          selected_projects=""
          allowed=",${GOVERNED_DOMAIN_COVERAGE_PROJECTS},"

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if [[ "$allowed" != *",$project,"* ]]; then
              continue
            fi

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:coverage'] ? 0 : 1);});"; then
              echo "Affected governed project with test:coverage: $project"
              has_target=true
              if [ -z "$selected_projects" ]; then
                selected_projects="$project"
              else
                selected_projects="$selected_projects,$project"
              fi
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_target=$has_target" >> "$GITHUB_OUTPUT"
          echo "projects=$selected_projects" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip governed domain coverage tests
        if: steps.detect-domain-coverage.outputs.has_target != 'true'
        run: echo "No affected governed projects expose test:coverage; skipping."

      - name: 📊 Run affected domain coverage gates
        if: steps.detect-domain-coverage.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage --projects="${{ steps.detect-domain-coverage.outputs.projects }}" --parallel=2 --outputStyle=static

  store-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected app-vue store coverage targets
        id: detect-store-coverage
        shell: bash
        run: |
          set -euo pipefail

          has_target=false
          selected_projects=""
          allowed=",${APP_VUE_STORE_COVERAGE_PROJECTS},"

          if [ -z "${APP_VUE_STORE_COVERAGE_PROJECTS}" ]; then
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if [[ "$allowed" != *",$project,"* ]]; then
              continue
            fi

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:coverage'] ? 0 : 1);});"; then
              echo "Affected project with test:coverage: $project"
              has_target=true
              if [ -z "$selected_projects" ]; then
                selected_projects="$project"
              else
                selected_projects="$selected_projects,$project"
              fi
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_target=$has_target" >> "$GITHUB_OUTPUT"
          echo "projects=$selected_projects" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip app-vue store coverage tests
        if: steps.detect-store-coverage.outputs.has_target != 'true'
        run: echo "No affected app-vue projects expose store coverage; skipping."

      - name: 📊 Run affected app-vue store coverage gates
        if: steps.detect-store-coverage.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage --projects="${{ steps.detect-store-coverage.outputs.projects }}" --parallel=1 --outputStyle=static

  use-cases-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected use-cases coverage targets
        id: detect-use-cases
        shell: bash
        run: |
          set -euo pipefail

          has_target=false
          selected_projects=""
          allowed=",${USE_CASES_COVERAGE_PROJECTS},"

          if [ -z "${USE_CASES_COVERAGE_PROJECTS}" ]; then
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if [[ "$allowed" != *",$project,"* ]]; then
              continue
            fi

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:coverage:use-cases'] ? 0 : 1);});"; then
              echo "Affected project with test:coverage:use-cases: $project"
              has_target=true
              if [ -z "$selected_projects" ]; then
                selected_projects="$project"
              else
                selected_projects="$selected_projects,$project"
              fi
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_target=$has_target" >> "$GITHUB_OUTPUT"
          echo "projects=$selected_projects" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip use-cases coverage tests
        if: steps.detect-use-cases.outputs.has_target != 'true'
        run: echo "No affected projects expose test:coverage:use-cases; skipping."

      - name: 📊 Run affected use-cases coverage gates
        if: steps.detect-use-cases.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage:use-cases --projects="${{ steps.detect-use-cases.outputs.projects }}" --parallel=2 --outputStyle=static

  prisma-mappers-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected prisma-mappers coverage targets
        id: detect-mappers
        shell: bash
        run: |
          set -euo pipefail

          has_target=false
          selected_projects=""
          allowed=",${PRISMA_MAPPERS_COVERAGE_PROJECTS},"

          if [ -z "${PRISMA_MAPPERS_COVERAGE_PROJECTS}" ]; then
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if [[ "$allowed" != *",$project,"* ]]; then
              continue
            fi

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:coverage:prisma-mappers'] ? 0 : 1);});"; then
              echo "Affected project with test:coverage:prisma-mappers: $project"
              has_target=true
              if [ -z "$selected_projects" ]; then
                selected_projects="$project"
              else
                selected_projects="$selected_projects,$project"
              fi
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_target=$has_target" >> "$GITHUB_OUTPUT"
          echo "projects=$selected_projects" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip prisma-mappers coverage tests
        if: steps.detect-mappers.outputs.has_target != 'true'
        run: echo "No affected projects expose test:coverage:prisma-mappers; skipping."

      - name: 📊 Run affected prisma-mappers coverage gates
        if: steps.detect-mappers.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run-many -t test:coverage:prisma-mappers --projects="${{ steps.detect-mappers.outputs.projects }}" --parallel=2 --outputStyle=static

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🏗️ Build affected apps
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t build --parallel=3 --exclude='contracts,utils,ui-core,assets,sync-client' --outputStyle=static

  ci-success:
    needs: [lint, typecheck, test, domain-coverage, store-coverage, use-cases-coverage, prisma-mappers-coverage, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: ✅ Check CI status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.domain-coverage.result }}" != "success" ] || \
             [ "${{ needs.store-coverage.result }}" != "success" ] || \
             [ "${{ needs.use-cases-coverage.result }}" != "success" ] || \
             [ "${{ needs.prisma-mappers-coverage.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
