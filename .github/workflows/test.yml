name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: 'true'
  NODE_ENV: test
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  TEST_DB_USER: test_user
  TEST_DB_PASS: test_pass
  TEST_DB_NAME: Memoflow_test
  TEST_DB_PORT: '5433'
  TEST_DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/Memoflow_test

jobs:
  unit-and-smoke:
    name: Unit & Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Run domain unit tests
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run task:test

      - name: Run API smoke tests
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run api:test:smoke

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASS }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - ${{ env.TEST_DB_PORT }}:5432
        options: >-
          --health-cmd "pg_isready -U ${{ env.TEST_DB_USER }} -d ${{ env.TEST_DB_NAME }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      JWT_SECRET: test-jwt-secret-not-for-production
      TZ: UTC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Push Prisma schema to test database
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run database:prisma-push

      - name: Run integration tests
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run task:test:integration
