name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: 'true'
  NODE_ENV: test
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'

jobs:
  smoke:
    name: Boundary Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected smoke targets
        id: detect-smoke
        shell: bash
        run: |
          set -euo pipefail

          has_target=false

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:smoke'] ? 0 : 1);});"; then
              echo "Affected project with test:smoke: $project"
              has_target=true
              break
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_target=$has_target" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip smoke tests
        if: steps.detect-smoke.outputs.has_target != 'true'
        run: echo "No affected projects expose test:smoke; skipping."

      - name: 🧪 Run affected smoke tests
        if: steps.detect-smoke.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:smoke --parallel=2 --outputStyle=static

  integration:
    name: Boundary Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: Memoflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d Memoflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5433/Memoflow_test
      JWT_SECRET: test-jwt-secret-not-for-production
      TZ: UTC

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected integration targets
        id: detect-integration
        shell: bash
        run: |
          set -euo pipefail

          has_target=false

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:integration'] ? 0 : 1);});"; then
              echo "Affected project with test:integration: $project"
              has_target=true
              break
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_target=$has_target" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip integration tests
        if: steps.detect-integration.outputs.has_target != 'true'
        run: echo "No affected projects expose test:integration; skipping."

      - name: 🗄️ Push Prisma schema to test database
        if: steps.detect-integration.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx run database:prisma-push

      - name: 🧪 Run affected integration tests
        if: steps.detect-integration.outputs.has_target == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:integration --parallel=1 --outputStyle=static

  desktop-boundary:
    name: Boundary Desktop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠️ Prepare workspace
        uses: ./.github/actions/setup-nx-affected-job
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔎 Detect affected desktop boundary targets
        id: detect-desktop
        shell: bash
        run: |
          set -euo pipefail

          has_ipc=false
          has_main=false

          while IFS= read -r project; do
            [ -z "$project" ] && continue

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:ipc'] ? 0 : 1);});"; then
              echo "Affected project with test:ipc: $project"
              has_ipc=true
            fi

            if pnpm exec nx show project "$project" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);process.exit(p.targets && p.targets['test:main'] ? 0 : 1);});"; then
              echo "Affected project with test:main: $project"
              has_main=true
            fi
          done < <(pnpm exec nx show projects --affected)

          echo "has_ipc=$has_ipc" >> "$GITHUB_OUTPUT"
          echo "has_main=$has_main" >> "$GITHUB_OUTPUT"

      - name: ℹ️ Skip desktop boundary tests
        if: steps.detect-desktop.outputs.has_ipc != 'true' && steps.detect-desktop.outputs.has_main != 'true'
        run: echo "No affected projects expose desktop boundary targets; skipping."

      - name: 🧪 Run affected IPC tests
        if: steps.detect-desktop.outputs.has_ipc == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:ipc --parallel=1 --outputStyle=static

      - name: 🧪 Run affected main-process tests
        if: steps.detect-desktop.outputs.has_main == 'true'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tools/ci/node-process-bootstrap.cjs
        run: pnpm exec nx affected -t test:main --parallel=1 --outputStyle=static
