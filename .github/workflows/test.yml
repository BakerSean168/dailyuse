name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ========== Job 1: Unit & Smoke Tests (no DB required) ==========
  unit-and-smoke:
    name: Unit & Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run domain unit tests
        run: npx vitest run --project task

      - name: Run API smoke tests
        run: npx vitest run --project api-smoke

  # ========== Job 2: Integration Tests (requires PostgreSQL) ==========
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dailyuse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d dailyuse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5433/dailyuse_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Generate Prisma client
        run: npx prisma generate --config packages/database/prisma/prisma.config.ts

      - name: Push Prisma schema to test database
        run: npx prisma db push --force-reset --config packages/database/prisma/prisma.config.ts

      - name: Run integration tests
        run: npx vitest run --project task-integration
