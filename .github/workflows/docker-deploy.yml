name: Build & Push Docker Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override image tag (leave empty for auto-generated)'
        required: false
        type: string

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  resolve-build-artifact:
    name: Resolve Verified Main Artifact
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/github-script@v8
        id: resolve
        with:
          script: |
            const sha = context.sha;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              status: 'success',
              per_page: 20,
            });
            const run = response.data.workflow_runs.find((candidate) => candidate.head_sha === sha);
            if (!run) core.setFailed(`No successful CI run found for ${sha}; refusing source rebuild promotion.`);
            else core.setOutput('run_id', String(run.id));
      - name: Resolve summary
        run: echo "Using verified CI run ${{ steps.resolve.outputs.run_id }} for ${{ github.sha }}"

  build-and-push:
    name: Build & Push Images
    needs: resolve-build-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ci-build-artifacts
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-artifact.outputs.run_id }}
      - name: Verify API and Web artifact manifests
        shell: bash
        run: |
          set -euo pipefail
          node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/api-artifact-manifest.json apps/api/dist
          node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/web-artifact-manifest.json dist/apps/web
          node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/migrator-artifact-manifest.json apps/migrator/dist
          node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/database-artifact-manifest.json packages/database/dist
          node ./tools/ci-cd-platform/verify-artifact.mjs reports/ci-cd-platform/database-runtime-artifact-manifest.json packages/database/dist/runtime-scripts
          test -f apps/migrator/dist/main.js
          test -f packages/database/dist/index.js
          test -d packages/database/dist/runtime-scripts
          node ./tools/ci-cd-platform/validate-manifest.mjs scope/delivery-manifest-v1.json delivery
          echo "DELIVERY_MANIFEST_DIGEST=$(node -p \"require('./scope/delivery-manifest-v1.json').digest\")" >> "$GITHUB_ENV"
      - name: Create production promotion manifest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: node ./tools/ci-cd-platform/promote-artifact.mjs reports/ci-cd-platform "${{ github.sha }}" production reports/ci-cd-platform/promotion-manifest.json

      - name: Resolve image tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          STAMP=$(date -u +%Y%m%d-%H%M%S)

          if [ -n "${{ inputs.tag_override }}" ]; then
            TAG="${{ inputs.tag_override }}"
          else
            TAG="v${VERSION}-prod.${STAMP}-${SHA}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ Image Tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-api:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-api:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
            USE_PREBUILT_ARTIFACT=1
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true

      - name: Build and push Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: migrator-runtime
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-migrator:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-migrator:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
            USE_PREBUILT_ARTIFACT=1
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-web:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-web:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true

      - name: Build and push AI Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ai-service
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-ai-service:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-ai-service:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
          provenance: true
          sbom: true

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REGISTRY="${{ secrets.ACR_REGISTRY }}"
          NS="${{ secrets.ACR_NAMESPACE }}"
          {
            echo "### ✅ Images pushed"
            echo "| Image | Tag |"
            echo "|-------|-----|"
            echo "| \`${REGISTRY}/${NS}/memoflow-api\` | \`${TAG}\` + \`prod-latest\` |"
            echo "| \`${REGISTRY}/${NS}/memoflow-migrator\` | \`${TAG}\` + \`prod-latest\` |"
            echo "| \`${REGISTRY}/${NS}/memoflow-web\` | \`${TAG}\` + \`prod-latest\` |"
            echo "| \`${REGISTRY}/${NS}/memoflow-ai-service\` | \`${TAG}\` + \`prod-latest\` |"
            echo ""
            echo "Web and AI Service remain eligible for Watchtower. API rollout must run the matching migrator image first."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload promotion provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-promotion-${{ github.sha }}
          path: reports/ci-cd-platform/promotion-manifest.json
          if-no-files-found: ignore
          retention-days: 90
