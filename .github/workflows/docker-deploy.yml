name: Build & Push Docker Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override image tag (leave empty for auto-generated)'
        required: false
        type: string

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: corepack enable && pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only
        env:
          CI: 'true'

      - name: Build applications
        run: |
          pnpm nx build api --outputStyle=static
          pnpm nx build web --configuration=production --outputStyle=static

      - name: Resolve image tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          STAMP=$(date -u +%Y%m%d-%H%M%S)

          if [ -n "${{ inputs.tag_override }}" ]; then
            TAG="${{ inputs.tag_override }}"
          else
            TAG="v${VERSION}-prod.${STAMP}-${SHA}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ Image Tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-api:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-api:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: migrator-runtime
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-migrator:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-migrator:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-web:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-web:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push AI Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ai-service
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-ai-service:${{ steps.tag.outputs.tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/memoflow-ai-service:prod-latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REGISTRY="${{ secrets.ACR_REGISTRY }}"
          NS="${{ secrets.ACR_NAMESPACE }}"
          {
            echo "### ✅ Images pushed"
            echo "| Image | Tag |"
            echo "|-------|-----|"
            echo "| \`${REGISTRY}/${NS}/memoflow-api\` | \`${TAG}\` + \`prod-latest\` |"
            echo "| \`${REGISTRY}/${NS}/memoflow-migrator\` | \`${TAG}\` + \`prod-latest\` |"
            echo "| \`${REGISTRY}/${NS}/memoflow-web\` | \`${TAG}\` + \`prod-latest\` |"
            echo "| \`${REGISTRY}/${NS}/memoflow-ai-service\` | \`${TAG}\` + \`prod-latest\` |"
            echo ""
            echo "Web and AI Service remain eligible for Watchtower. API rollout must run the matching migrator image first."
          } >> "$GITHUB_STEP_SUMMARY"
