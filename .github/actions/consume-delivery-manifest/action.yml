name: Consume Delivery Manifest
description: Download and validate the immutable delivery manifest generated by Scope Detector.
inputs:
  artifact-name:
    description: Name of the uploaded delivery manifest artifact
    required: false
    default: delivery-manifest-v1
  required:
    description: Whether a missing manifest should fail the lane
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Download delivery manifest
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: scope
    - name: Validate delivery manifest
      shell: bash
      run: node ./tools/ci-cd-platform/validate-manifest.mjs scope/delivery-manifest-v1.json delivery
