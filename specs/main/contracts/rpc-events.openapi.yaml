openapi: 3.1.0
info:
  title: DailyUse Contracts RPC/Event Map
  version: 0.1.0
  description: Base RPC/event contract map for all modules in packages/contracts.
paths: {}
components:
  schemas:
    RpcEnvelope:
      type: object
      required:
        - event
        - request
      properties:
        event:
          type: string
          description: Namespaced event key, e.g. auth:login
        request:
          type: object
          description: Request payload typed by the module API schema
    RpcResponseEnvelope:
      type: object
      required:
        - event
        - response
      properties:
        event:
          type: string
        response:
          type: object
          description: Response payload typed by the module API schema or DTO
x-rpc-events:
  account:
    protocol: packages/contracts/src/modules/account/protocol
    api: packages/contracts/src/modules/account/api
    dtos: packages/contracts/src/modules/account/dtos
