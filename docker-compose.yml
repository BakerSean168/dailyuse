services:
  # 开发数据库 - PostgreSQL 16
  postgres-dev:
    image: postgres:16-alpine
    container_name: dailyuse-dev-db
    environment:
      POSTGRES_USER: dailyuse
      POSTGRES_PASSWORD: dailyuse123
      POSTGRES_DB: dailyuse
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dailyuse -d dailyuse']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 测试数据库 - PostgreSQL 15 (使用 tmpfs，速度更快)
  postgres-test:
    image: postgres:15-alpine
    container_name: dailyuse-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: dailyuse_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data:rw
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d dailyuse_test']
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - 'postgres'
      - '-c'
      - 'fsync=off'
      - '-c'
      - 'synchronous_commit=off'
      - '-c'
      - 'full_page_writes=off'

  # Redis - 端口 6384
  redis-dev:
    image: redis:7-alpine
    container_name: dailyuse-dev-redis
    ports:
      - '6384:6379'
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes --requirepass dailyuse123
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PowerSync Service - 实时同步引擎
  powersync-dev:
    image: journeyapps/powersync-service:latest
    container_name: dailyuse-dev-powersync
    ports:
      - '8080:8080'
    depends_on:
      postgres-dev:
        condition: service_healthy
    volumes:
      - ./docker/powersync/powersync.yaml:/config/powersync.yaml
    command: ['start', '-c', '/config/powersync.yaml']
    environment:
      # Source Postgres connection (replication)
      PS_SOURCE_URI: postgresql://dailyuse:dailyuse123@postgres-dev:5432/dailyuse
      # Storage Postgres connection (sync bucket storage)
      PS_STORAGE_URI: postgresql://dailyuse:dailyuse123@postgres-dev:5432/dailyuse
      # JWKS public key components (must match API's RSA key pair)
      PS_JWK_N: ${POWERSYNC_PUBLIC_KEY_N:-iPsCAeT3UnpBpzEuLxRxsnj3GCGLp8UQrv5_WGLGR4Q0nw8OX_wmYGb4pGIzcnYsjM_JkmzZZxxtdS_lT6pWcQs9UdZbSxb1XDD_nRjohdrFvFEjGrATte05qm1Aj2VzmJnowh1tBC_QhVpljjQLBhfbQupgB4H-nuD4HKuzCYQ2-lo-zr2zRVQM9MBsuSFgijPHdHdejKqCKje4VIFjz-zxygoUvxtct3Fcloz06wtURLu5qSwHVAKOgwyHz008iSEZdvm7FfK0M931PH8iZKMb_2OIXDgc_vfIcXw5fadGo3qCgb0hFTE5WK3kHYlRxTCKDPCdznsdW_ZwIwXGvQ}
      PS_JWK_E: ${POWERSYNC_PUBLIC_KEY_E:-AQAB}
      PS_JWK_KID: ${POWERSYNC_KEY_ID:-powersync-dev-d90f228f}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/status']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-dev-data:
    name: dailyuse-dev-db-data
  redis-dev-data:
    name: dailyuse-dev-redis-data
