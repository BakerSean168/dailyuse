# =============================================================================
# 本地 Docker 部署测试 Compose Override
# =============================================================================
# 用法：
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml \
#     -f docker-compose.local-test.yml --env-file .env.production.local up -d
#
# 覆盖说明：
#   - 使用本地构建的镜像（来自 docker-compose.local.yml）
#   - 跳过 Caddy（本地无域名/HTTPS）和 Watchtower（本地无需自动更新）
#   - Web 直接暴露 8080 端口供浏览器访问
#   - API 暴露 3000 端口供调试
#   - AI Service 暴露 8100 端口供调试
# =============================================================================

services:
  # 移除对 Caddy 的依赖，直接暴露端口
  web:
    ports:
      - "8080:80"

  api:
    ports:
      - "3000:3000"
    environment:
      # Local Docker testing serves the web app from :8080, and Nginx forwards
      # the browser's Origin header to the API. Override prod env-file values
      # so the local browser and direct API debugging both work by default.
      CORS_ORIGIN: ${LOCAL_TEST_CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}

  ai-service:
    ports:
      - "8100:8100"

  # 禁用 Caddy（本地测试不需要 HTTPS）
  caddy:
    profiles:
      - disabled

  # 禁用 Watchtower（本地测试不需要自动更新）
  watchtower:
    profiles:
      - disabled
